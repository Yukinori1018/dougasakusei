[project]
name = "dougasakusei"
version = "0.1.0"
description = "Semi-automated YouTube video generation pipeline for tax/accounting/AI-tools niche"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomli>=2.0",
    "jinja2>=3.1",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pillow>=10.3",
    "numpy>=1.26",
    "opentimelineio>=0.17",
    "tenacity>=8.3",
    "langgraph>=0.2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "pydub>=0.25",
]
viz = [
    "manim>=0.18",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
